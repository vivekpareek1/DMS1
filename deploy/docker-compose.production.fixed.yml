version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultdms
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose: ["5432"]
    # ports: ["127.0.0.1:5432:5432"] # For dev only, uncomment if needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vaultdms"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    user: "999:999"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    expose: ["6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    user: "999:999"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://vault:${DB_PASSWORD}@postgres:5432/vaultdms
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET min 32 chars required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:?Required}
      DRIVE_ROOT_FOLDER_ID: ${DRIVE_ROOT_FOLDER_ID:?Required}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-180}
      LOG_ARCHIVE_MODE: ${LOG_ARCHIVE_MODE:-false}
      LOG_LEGAL_HOLD: ${LOG_LEGAL_HOLD:-false}
      EDITION: ${EDITION:-STANDARD}
    ports: ["3001:3001"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
