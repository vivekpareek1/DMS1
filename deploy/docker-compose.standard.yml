
# STANDARD EDITION - $29/user/mo - 50 users, 1TB, Most Popular
# Full features except advanced DLP
version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultdms
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vaultdms"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  backend:
    build: ../backend
    environment:
      EDITION: STANDARD
      DATABASE_URL: postgresql://vault:${DB_PASSWORD}@postgres:5432/vaultdms
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      DRIVE_ROOT_FOLDER_ID: ${DRIVE_ROOT_FOLDER_ID}
      LOG_RETENTION_DAYS: 180
      LOG_ARCHIVE_MODE: ${LOG_ARCHIVE_MODE:-false}
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ../frontend
    environment:
      NEXT_PUBLIC_EDITION: STANDARD
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
    ports: ["3000:3000"]

volumes: { pgdata: }
